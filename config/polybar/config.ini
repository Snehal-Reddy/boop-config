;==========================================================
;  Smoked Glass Floating Pill — Polybar 3.7+
;==========================================================

[colors]
background       = #BD11131A
background-alt   = #363F54
foreground       = #E6E9EF
foreground-muted = #8E95A8
accent           = #89B4FA
amber            = #E5C07B
green            = #A6E3A1
purple           = #CBA6F7
red              = #F38BA8
divider          = #4C5368

[bar/main]
width = 98%
height = 30
offset-x = 1%
offset-y = 6

override-redirect = true
wm-restack = i3

background = ${colors.background}
foreground = ${colors.foreground}

padding-left = 12px
padding-right = 14px
module-margin = 8px

font-0 = "Noto Sans:size=9.5;2"
font-1 = "FontAwesome:size=10;2"
font-2 = "DejaVu Sans Mono:size=9;4"

modules-left = smart-windows sep xwindow
modules-center = spotify date
modules-right = filesystem memory brightness audio wlan blueman systray powermenu

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/sep]
type = custom/text
format = |
format-foreground = ${colors.divider}

[module/smart-windows]
type = custom/script
exec = ~/.config/polybar/scripts/i3_windows.py
tail = true

[module/xwindow]
type = internal/xwindow
label = %title:0:32:…%
label-foreground = ${colors.foreground-muted}
label-empty =

[module/spotify]
type = custom/script
exec = ~/.config/polybar/scripts/spotify_status.py
interval = 2
click-left = gdbus call --session --dest org.mpris.MediaPlayer2.spotify --object-path /org/mpris/MediaPlayer2 --method org.mpris.MediaPlayer2.Player.PlayPause >/dev/null 2>&1
click-right = i3-msg -q workspace "5: Spotify"
scroll-up = gdbus call --session --dest org.mpris.MediaPlayer2.spotify --object-path /org/mpris/MediaPlayer2 --method org.mpris.MediaPlayer2.Player.Next >/dev/null 2>&1
scroll-down = gdbus call --session --dest org.mpris.MediaPlayer2.spotify --object-path /org/mpris/MediaPlayer2 --method org.mpris.MediaPlayer2.Player.Previous >/dev/null 2>&1

[module/date]
type = internal/date
interval = 1

date = %a %d %b  %H:%M
date-alt = %Y-%m-%d  %H:%M:%S

format-prefix = "  "
format-prefix-foreground = ${colors.accent}
label = %date%

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /

format-mounted-prefix = " "
format-mounted-prefix-foreground = ${colors.accent}
label-mounted = %free%
label-unmounted = %mountpoint% n/a
label-unmounted-foreground = ${colors.foreground-muted}

[module/memory]
type = internal/memory
interval = 2

format-prefix = " "
format-prefix-foreground = ${colors.purple}
label = %percentage_used%%

[module/brightness]
type = custom/script
exec = ~/.config/polybar/scripts/brightness.sh
interval = 1
click-left = ~/.config/polybar/scripts/control_popup.py brightness &
scroll-up = ~/.config/scripts/brightness.sh up
scroll-down = ~/.config/scripts/brightness.sh down

[module/audio]
type = custom/script
exec = ~/.config/polybar/scripts/audio_status.py
tail = true
click-left = ~/.config/polybar/scripts/control_popup.py audio &
click-middle = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = pavucontrol &
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3

format-connected = %{A1:nm-connection-editor &:}%{F#A6E3A1}%{F-} <ramp-signal>%{A}

ramp-signal-0 = %{T3}%{F#F38BA8}▁%{F#4C5368}▃▅▇%{F-}%{T-}
ramp-signal-1 = %{T3}%{F#E5C07B}▁▃%{F#4C5368}▅▇%{F-}%{T-}
ramp-signal-2 = %{T3}%{F#E5C07B}▁▃▅%{F#4C5368}▇%{F-}%{T-}
ramp-signal-3 = %{T3}%{F#A6E3A1}▁▃▅%{F#4C5368}▇%{F-}%{T-}
ramp-signal-4 = %{T3}%{F#A6E3A1}▁▃▅▇%{F-}%{T-}

format-disconnected = %{A1:nm-connection-editor &:}%{F#F38BA8} off%{F-}%{A}

[module/blueman]
type = custom/script
exec = ~/.config/polybar/blueman_launcher.sh
interval = 5
format-foreground = ${colors.accent}
click-left = blueman-manager &

[module/systray]
type = internal/tray
format-margin = 2px
tray-spacing = 8px
tray-size = 15px

[module/powermenu]
type = custom/text
format = 
format-foreground = ${colors.red}
format-padding = 6px
click-left = ~/.config/polybar/scripts/powermenu.sh &
