# BEGIN_KITTY_THEME
# Belafonte Night
include current-theme.conf
# END_KITTY_THEME

enable_audio_bell no

background_opacity 0.75
dynamic_background_opacity yes

scrollback_lines 10000

# free ctrl+shift+l (default: next_layout, unused since zellij handles
# splitting) so it passes through to programs running inside kitty
map kitty_mod+l

# free ctrl+shift+n (default: new_os_window) so it passes through to
# programs running inside kitty (used by micro for FindPrevious)
map kitty_mod+n

# Allow Zellij / Micro / zellij-open-smart to read and write clipboard via OSC 52 without prompting
clipboard_control write-clipboard write-primary read-clipboard read-primary

# Replace default ctrl+shift+c copy_to_clipboard with smart link copier (selection -> hovered URL -> hints)
map kitty_mod+c
map ctrl+shift+c kitten copy_url_under_cursor.py

# Copy hovered link (if any) and forward Alt+Shift+M to Zellij (zellij-open-smart floating leaf/micro)
map ctrl+shift+m combine : kitten copy_url_under_cursor.py --no-hints : send_key alt+shift+m

