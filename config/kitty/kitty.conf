# BEGIN_KITTY_THEME
# Belafonte Night
include current-theme.conf
# END_KITTY_THEME

enable_audio_bell no

background_opacity 0.75
dynamic_background_opacity yes

scrollback_lines 10000

# free ctrl+shift+l (default: next_layout, unused since zellij handles
# splitting) so it passes through to programs running inside kitty
map kitty_mod+l

# free ctrl+shift+n (default: new_os_window) so it passes through to
# programs running inside kitty (used by micro for FindPrevious)
map kitty_mod+n

# Allow Zellij / Micro / zellij-open-smart to read and write clipboard via OSC 52 without prompting
clipboard_control write-clipboard write-primary read-clipboard read-primary

