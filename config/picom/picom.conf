# ~/.config/picom/picom.conf
# Smoked Glass compositor config (Picom v12+)

backend = "glx";
vsync = true;

# Rounded corners (gives floating Polybar pill, Rofi, and windows smooth edges)
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "fullscreen"
];

# Frosted Smoked Glass blur
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-exclude = [
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@"
];

# Subtle shadow so floating pill & menus lift cleanly off the wallpaper
shadow = true;
shadow-radius = 14;
shadow-offset-x = -10;
shadow-offset-y = -8;
shadow-opacity = 0.45;
shadow-exclude = [
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@",
  "class_g = 'i3-frame'"
];

# Smooth fading
fading = true;
fade-delta = 4;
fade-in-step = 0.04;
fade-out-step = 0.04;

# kitty already handles its own background_opacity in kitty.conf
opacity-rule = [
];
