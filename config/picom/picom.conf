# ~/.config/picom/picom.conf

# Opacity
# kitty now handles its own transparency via background_opacity in
# kitty.conf, so it's excluded here to avoid double-blending text.
opacity-rule = [
];

# This is a bit of a placeholder. We will adjust it in the next step.
# To get started, let's just make everything transparent
# active-opacity = 1.0;
# inactive-opacity = 0.9;
# frame-opacity = 1.0;
# inactive-opacity-override = false;
# focus-exclude = [];

# Fade animations
# These are nice but optional
# fading = true;
# fade-delta = 4;
# fade-in-step = 0.03;
# fade-out-step = 0.03;
# no-fading-openclose = true;

# Backend
# The default is xrender, which is fine for most cases.
# If you have issues, try glx or another backend.
# backend = "xrender";

# Shadow
# To disable shadows, uncomment this line:
# no-shadow = true;
